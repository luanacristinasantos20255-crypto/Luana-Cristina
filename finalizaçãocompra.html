<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finalizar Compra | Haras Elite</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f4f4;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#4a2e1c,#7a4d2d);
    color:white;
    text-align:center;
    padding:30px;
}

/* MENU */
nav{
    background:#2f1c10;
    text-align:center;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

nav a:hover{
    color:#d8a25e;
}

/* CONTAINER */
.container{
    width:90%;
    max-width:900px;
    margin:auto;
    padding:50px 0;
}

/* CARD */
.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

/* FORM */
.card h2{
    color:#5c3a21;
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    transition:.3s;
}

input:focus, select:focus{
    border-color:#5c3a21;
}

/* BOTÃO */
button{
    width:100%;
    padding:15px;
    background:#5c3a21;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    margin-top:15px;
    transition:.3s;
}

button:hover{
    background:#8a5a35;
}

/* RESUMO */
.resumo{
    margin-top:20px;
    padding:15px;
    background:#f9f9f9;
    border-radius:10px;
    border-left:5px solid #5c3a21;
}

/* RODAPÉ */
footer{
    background:#2f1c10;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:50px;
}

/* RESPONSIVO */
@media(max-width:768px){
    nav a{
        display:block;
        margin:10px 0;
    }
}

</style>

</head>
<body>

<header>
    <h1>🐎 Finalizar Compra</h1>
    <p>Haras Elite - Checkout Seguro</p>
</header>

<nav>
    <a href="indexsitevendadecavalo.html">Início</a>
    <a href="carácteristicas.html">Cavalos</a>
    <a href="vendas.html">Vendas</a>
    <a href="finalizaçãocompra.html">Compras</a>
    <a href="formulario.html">Contato</a>
</nav>

<div class="container">

<div class="card">

<h2>Dados do Comprador</h2>

<input type="text" id="nome" placeholder="Nome Completo">
<input type="email" id="email" placeholder="E-mail">
<input type="tel" id="telefone" placeholder="Telefone">

<select id="cavalo">
    <option value="">Escolha o cavalo</option>
    <option value="Thunder - R$ 35.000">Thunder</option>
    <option value="Relâmpago - R$ 42.000">Relâmpago</option>
    <option value="Imperador - R$ 50.000">Imperador</option>
    <option value="Furacão - R$ 38.000">Furacão</option>
    <option value="Trovão - R$ 55.000">Trovão</option>
    <option value="Diamante - R$ 62.000">Diamante</option>
</select>

<select id="pagamento">
    <option value="">Forma de pagamento</option>
    <option>PIX</option>
    <option>Cartão de Crédito</option>
    <option>Transferência Bancária</option>
    <option>Financiamento Rural</option>
</select>

<button onclick="finalizarCompra()">
Finalizar Compra
</button>

<div class="resumo" id="resumo">
    Preencha os dados para ver o resumo da compra.
</div>

</div>

</div>

<footer>
    <h3>Haras Elite</h3>
    <p>Compra segura e garantida</p>
    <p>© 2025 Todos os direitos reservados</p>
</footer>

<script>

function finalizarCompra(){

    let nome = document.getElementById("nome").value;
    let email = document.getElementById("email").value;
    let telefone = document.getElementById("telefone").value;
    let cavalo = document.getElementById("cavalo").value;
    let pagamento = document.getElementById("pagamento").value;

    if(nome === "" || email === "" || telefone === "" || cavalo === "" || pagamento === ""){
        alert("Por favor, preencha todos os campos!");
        return;
    }

    document.getElementById("resumo").innerHTML = 
    "<h3>Resumo da Compra</h3>" +
    "<p><strong>Cliente:</strong> " + nome + "</p>" +
    "<p><strong>Cavalo:</strong> " + cavalo + "</p>" +
    "<p><strong>Pagamento:</strong> " + pagamento + "</p>" +
    "<p style='color:green;font-weight:bold;'>Compra realizada com sucesso!</p>";

    alert("Compra finalizada com sucesso! Entraremos em contato em breve.");

}

</script>

</body>
</html>
