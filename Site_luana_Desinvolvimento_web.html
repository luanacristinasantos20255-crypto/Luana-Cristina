<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haras Elite</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#4b2e1e;
    color:white;
    padding:20px;
    text-align:center;
}

nav{
    background:#6d442c;
    padding:15px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

nav a:hover{
    color:gold;
}

.hero{
    height:80vh;
    background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb') center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
}

.hero h1{
    font-size:60px;
    background:rgba(0,0,0,0.5);
    padding:20px;
    border-radius:10px;
}

.container{
    padding:40px;
    text-align:center;
}

.cards{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:30px;
}

.card{
    background:white;
    width:300px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    border-radius:10px;
}

button{
    background:#6d442c;
    color:white;
    border:none;
    padding:10px 20px;
    margin-top:15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#4b2e1e;
}

footer{
    background:#4b2e1e;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

</style>
</head>
<body>

<header>
    <h1>HARAS ELITE</h1>
    <p>Os melhores cavalos do Brasil</p>
</header>

<nav>
    <a href="index.html">Início</a>
    <a href="sobre.html">Sobre</a>
    <a href="cavalos.html">Cavalos</a>
    <a href="galeria.html">Galeria</a>
    <a href="contato.html">Contato</a>
</nav>

<section class="hero">
    <h1>Elegância • Velocidade • Qualidade</h1>
</section>

<section class="container">

    <h2>Cavalos em destaque</h2>

    <div class="cards">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a">
            <h3>Raio Negro</h3>
            <p>Velocidade e força incomparáveis.</p>
            <button onclick="alert('Raio Negro disponível!')">Saiba Mais</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1508672019048-805c876b67e2">
            <h3>Trovão</h3>
            <p>Excelente para competições.</p>
            <button onclick="alert('Trovão disponível!')">Saiba Mais</button>
        </div>

    </div>

</section>

<footer>
    © 2026 Haras Elite
</footer>

</body>
</html>
